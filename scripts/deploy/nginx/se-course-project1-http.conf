# Include once at the nginx http{} level (e.g. conf.d).
# Server-level routes live in se-course-project1-routes.conf.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream campus_market_api {
    server 127.0.0.1:8001;
    keepalive 32;
}

upstream campus_market_ws {
    server 127.0.0.1:8002;
}

