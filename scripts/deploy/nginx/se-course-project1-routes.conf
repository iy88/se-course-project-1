# Merge into the existing `server { ... }` block. Static `/`, PWA entry/cache
# rules and TLS remain exactly where they are in the current host config.
location /api/ {
    client_max_body_size 10m;
    proxy_pass http://campus_market_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # This source is HTTP behind the existing HTTPS edge termination.
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}

location /ws {
    # Tickets are query credentials. Disable this location's access log rather
    # than trusting a log format; the public edge layer must redact/suppress its
    # own query-string logs too.
    access_log off;
    proxy_pass http://campus_market_ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # Keep the existing 300 s proxy timeout; app heartbeat is 20 s/60 s.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
}
