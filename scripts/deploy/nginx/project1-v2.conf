map $http_upgrade $project1_v2_connection_upgrade {
    default upgrade;
    '' close;
}

upstream project1_v2_api {
    include /etc/nginx/snippets/project1-v2-upstream.conf;
    keepalive 16;
}

server {
    listen 80;
    server_name mobile.v2.cm.iy88.site;
    root /srv/se-course-project1-v2/state/current/user-web;
    include /etc/nginx/snippets/project1-v2-routes.conf;
}

server {
    listen 80;
    server_name admin.v2.cm.iy88.site;
    root /srv/se-course-project1-v2/state/current/admin-web;
    include /etc/nginx/snippets/project1-v2-routes.conf;
}
