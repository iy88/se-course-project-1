map $http_upgrade $project1_v2_connection_upgrade {
    default upgrade;
    '' close;
}

upstream project1_v2_api {
    server 127.0.0.1:18081;
    server 127.0.0.1:18082;
    keepalive 16;
}

server {
    listen 80;
    server_name mobile.v2.cm.iy88.site;
    root /srv/se-course-project1-v2/current/user-web;
    include /etc/nginx/snippets/project1-v2-routes.conf;
}

server {
    listen 80;
    server_name admin.v2.cm.iy88.site;
    root /srv/se-course-project1-v2/current/admin-web;
    include /etc/nginx/snippets/project1-v2-routes.conf;
}
