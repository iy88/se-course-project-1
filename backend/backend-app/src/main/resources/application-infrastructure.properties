spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.redis.url=${REDIS_URL}
spring.data.redis.connect-timeout=5s
spring.data.redis.timeout=5s
spring.data.redis.repositories.enabled=false
project1.redis.namespace=${REDIS_NAMESPACE}

project1.files.upload-ttl-seconds=${FILE_UPLOAD_TTL_SECONDS:300}
project1.files.temp-retention-seconds=${FILE_TEMP_RETENTION_SECONDS:86400}
project1.files.rule-version=${FILE_RULE_VERSION:s1-v1}
project1.files.product-image.max-bytes=${FILE_PRODUCT_IMAGE_MAX_BYTES:104857600}
project1.files.product-image.allowed-content-types=${FILE_PRODUCT_IMAGE_CONTENT_TYPES:image/jpeg,image/png}
project1.files.case-evidence.max-bytes=${FILE_CASE_EVIDENCE_MAX_BYTES:104857600}
project1.files.case-evidence.allowed-content-types=${FILE_CASE_EVIDENCE_CONTENT_TYPES:image/jpeg,image/png,application/pdf}
project1.files.read-url-ttl-seconds=${FILE_READ_URL_TTL_SECONDS:60}
project1.files.cleanup-scan-seconds=${FILE_CLEANUP_SCAN_SECONDS:300}

#---
spring.config.activate.on-profile=!dependency-probe
server.address=${HTTP_BIND_HOST}
server.port=${HTTP_BIND_PORT}
