spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.redis.url=${REDIS_URL}
spring.data.redis.connect-timeout=5s
spring.data.redis.timeout=5s
spring.data.redis.repositories.enabled=false
project1.redis.namespace=${REDIS_NAMESPACE}

project1.files.upload-ttl-seconds=${FILE_UPLOAD_TTL_SECONDS:300}
project1.files.temp-retention-seconds=${FILE_TEMP_RETENTION_SECONDS:86400}
project1.files.rule-version=${FILE_RULE_VERSION:s1-v1}
project1.files.product-image.max-bytes=${FILE_PRODUCT_IMAGE_MAX_BYTES:104857600}
project1.files.product-image.allowed-content-types=${FILE_PRODUCT_IMAGE_CONTENT_TYPES:image/jpeg,image/png}
project1.files.case-evidence.max-bytes=${FILE_CASE_EVIDENCE_MAX_BYTES:104857600}
project1.files.case-evidence.allowed-content-types=${FILE_CASE_EVIDENCE_CONTENT_TYPES:image/jpeg,image/png,application/pdf}
project1.files.read-url-ttl-seconds=${FILE_READ_URL_TTL_SECONDS:60}
project1.files.cleanup-scan-seconds=${FILE_CLEANUP_SCAN_SECONDS:300}

project1.write.lock-timeout-seconds=${DB_LOCK_TIMEOUT_SECONDS:3}
project1.write.transaction-timeout-seconds=${DB_TRANSACTION_TIMEOUT_SECONDS:10}
project1.write.retry-limit=${TX_RETRY_LIMIT:3}
project1.write.retry-base-milliseconds=${TX_RETRY_BASE_MILLISECONDS:50}
project1.write.idempotency-key-max-length=${IDEMPOTENCY_KEY_MAX_LENGTH:128}
project1.write.idempotency-retention-seconds=${IDEMPOTENCY_RETENTION_SECONDS:86400}

project1.delivery.retention-seconds=${EVENT_RETENTION_SECONDS:604800}
project1.delivery.replay-max=${EVENT_REPLAY_MAX:500}
project1.delivery.lease-seconds=${WORK_LEASE_SECONDS:60}
project1.delivery.io-timeout-seconds=${WORK_IO_TIMEOUT_SECONDS:10}
project1.delivery.retry-limit=${WORK_RETRY_LIMIT:5}
project1.delivery.retry-base-seconds=${WORK_RETRY_BASE_SECONDS:2}
project1.delivery.batch-size=${WORK_BATCH_SIZE:32}
project1.delivery.stream-max-length=${EVENT_STREAM_MAX_LENGTH:10000}

project1.realtime.replay-limit=${EVENT_REPLAY_LIMIT:100}
project1.realtime.head-poll-seconds=${EVENT_HEAD_POLL_SECONDS:5}
project1.realtime.account-limit=${IM_ACCOUNT_CONNECTION_LIMIT:8}
project1.realtime.session-limit=${IM_SESSION_CONNECTION_LIMIT:4}
project1.realtime.hello-seconds=${IM_HELLO_TIMEOUT_SECONDS:5}
project1.realtime.heartbeat-seconds=${IM_HEARTBEAT_SECONDS:20}
project1.realtime.idle-seconds=${IM_IDLE_SECONDS:60}
project1.realtime.max-frame-bytes=${IM_MAX_FRAME_BYTES:16384}
project1.realtime.unacknowledged=${IM_UNACKED_WINDOW:500}

#---
spring.config.activate.on-profile=!dependency-probe
server.address=${HTTP_BIND_HOST}
server.port=${HTTP_BIND_PORT}
