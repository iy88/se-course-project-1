# Alembic configuration: URL/credentials are read by alembic/env.py from the
# migration-only fields in APP_ENV_FILE and are never written to this file or
# expanded into command lines or logs.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os

# Only for legacy calls that explicitly require a placeholder; env.py overrides
# it with the migration-only connection.
sqlalchemy.url =

[post_write_hooks]
