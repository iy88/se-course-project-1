[project]
name = "campus-market-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.17.0",
    "asyncpg>=0.30.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
    "alibabacloud-oss-v2>=1.4.1",
    "sqlmodel>=0.0.48",
    "pillow>=13.0.0",
    "tzdata>=2026.6 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.10",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]
sigterm = true
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
precision = 2
show_missing = true
