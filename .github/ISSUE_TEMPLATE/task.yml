name: 人工验收任务
description: 按 demo-seed 场景与浏览器人工通道开展的验收任务（含需求实现核对）
title: "[测试任务] "
labels: ["testing"]
body:
  - type: markdown
    attributes:
      value: |
        使用前先阅读 `docs/development/整体验收.md`（浏览器人工验收流程）与 `docs/development/demo-seed.md`（场景、账号与对象）。
        业务规则以 `backend/tests/acceptance_real` 的真实 API 验收为基线；本任务只验界面、交互、浏览器集成与需求入口是否完整，**不重复逐条验证接口规则**。
        自动化 PASS 不等于人工 PASS，人工 PASS 也不能替代生产部署或性能验收。
  - type: input
    id: owner
    attributes:
      label: 执行人
      placeholder: 成员姓名
    validations:
      required: true
  - type: input
    id: batch
    attributes:
      label: 验收批次 / run_id
      description: 证据目录名，建议 `<日期>-<manifest tag>`
      placeholder: 20261102-bd62b76822815ca6
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与依据
      description: 需求编号、demo 场景 key、人工通道、本轮重点回归区域
      placeholder: |
        US/UC/SC：...
        demo 场景：...
        人工通道：UI-LAYOUT-01、UI-STATE-01 ...
        重点回归：本轮前端变更 ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与前置
      description: 执行前逐项确认并回填，不通过不得开始
      placeholder: |
        HEAD: ______（git rev-parse HEAD）
        工作区改动: ______
        .env.dev 非生产；migrate + demo-seed + demo-verify 通过；verify 摘要: ______
        manifest tag: ______ / catalog_version: 2
        服务: 8000 / 5173 / 5174，/api/health = ok
        浏览器与视口: Chrome ______ / 390×844（补充 375×667）
        证据目录: var/manual-acceptance/<run_id>/<member>/
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: 必测清单（P0）
      description: 每项写检查号、步骤、预期、依据、证据；使用 - [ ] 复选列表
      placeholder: |
        - [ ] A-01 ...
          - 步骤: ...
          - 预期: ...
          - 依据: US-...
          - 证据: ...
    validations:
      required: true
  - type: textarea
    id: requirement
    attributes:
      label: 需求实现核对（逐 AC）
      description: 本任务负责的 US/AC 范围、页面入口、结论；缺入口/未实现/部分实现要新建 feature issue
      placeholder: |
        方法：对每条 AC 找到页面入口，按条件操作，记录结论（已实现/部分实现/缺界面入口/未实现/BLOCKED/N/A）。
        输出：AC 状态表（AC | 页面入口 | 结论 | feature/bug 编号 | 证据）。
        统计：已实现 __ / 部分 __ / 缺入口 __ / 未实现 __ / BLOCKED __ / N/A __。
    validations:
      required: true
  - type: textarea
    id: excluded
    attributes:
      label: 不在本任务范围（自动化已覆盖）
      description: 列出不需要人工复测的自动检查及证据
    validations:
      required: true
  - type: textarea
    id: completion
    attributes:
      label: 完成标准
      value: |
        - [ ] P0 全部 PASS，或未通过项均有已关闭的缺陷/需求缺口且回归通过
        - [ ] P1 已执行，或注明未执行原因（未执行不算 PASS）
        - [ ] 范围内每条 AC 有结论；缺口均有 feature issue 或负责人书面决定
        - [ ] 证据目录可复查，截图已脱敏
        - [ ] 结果表与 AC 状态表已贴在评论
        - [ ] 负责人复核通过后关闭本任务
    validations:
      required: true
  - type: input
    id: reviewer
    attributes:
      label: 复核人
      value: 袁尚峰
    validations:
      required: true
  - type: input
    id: evidence_dir
    attributes:
      label: 证据目录
      placeholder: var/manual-acceptance/<run_id>/<member>/
    validations:
      required: true
