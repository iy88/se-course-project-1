name: 功能需求
description: 提出新功能，或记录现有需求中缺失的功能、入口和场景。
title: "[功能] "
labels: ["feature"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 场景与需求
      description: 说明谁在什么场景下需要完成什么操作，以及目前缺少的能力。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 预期行为与验收条件
      description: 写明触发条件、操作以及用户能观察到的结果。涉及多个角色或状态时分别说明。
      placeholder: |
        - [ ] 当……时，执行……，应看到……
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 影响范围
      description: 填写受影响的页面、接口、角色或其他任务。
  - type: textarea
    id: references
    attributes:
      label: 相关依据
      description: 可附需求编号、关联 Issue、设计链接或脱敏截图。
      placeholder: "US-02-AC-01、BR-09、#123"
