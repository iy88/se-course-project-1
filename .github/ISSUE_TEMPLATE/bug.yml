name: 缺陷报告
description: 报告已实现功能的行为错误、异常或回归。
title: "[缺陷] "
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 写明入口、操作顺序、账号角色与必要的前置状态。偶发问题可补充触发条件和频率。
      placeholder: |
        1. 打开……
        2. 执行……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 说明正常情况下应出现的页面、响应或状态。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 记录实际表现及影响，附上可见的错误码或提示。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 版本与环境
      description: 可填写版本或 commit、部署环境及相关的设备、浏览器或 API。
      placeholder: "测试环境；版本或 commit；浏览器及版本"
  - type: textarea
    id: evidence
    attributes:
      label: 相关证据与链接
      description: 可附脱敏的日志、截图、请求 ID、关联 Issue 或需求编号。
