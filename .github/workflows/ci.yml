name: CI

on:
  push:
    branches: [legacy]
  pull_request:
    branches: [legacy]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-acceptance:
    name: Backend acceptance (SQLite/local)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Sync backend dependencies
        run: uv sync --locked --managed-python --python 3.13

      - name: Install Redis 8.2+ for acceptance services
        # The acceptance Taskiq broker requires XACKDEL REF_POLICY ACKED.
        run: |
          sudo apt-get update
          sudo apt-get install -y lsb-release curl gpg
          curl -fsSL https://packages.redis.io/gpg -o /tmp/project1-redis-signing-key
          sudo gpg --dearmor --batch --yes -o /usr/share/keyrings/redis-archive-keyring.gpg /tmp/project1-redis-signing-key
          sudo chmod 644 /usr/share/keyrings/redis-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/redis.list
          sudo apt-get update
          sudo apt-get install -y redis-server redis-tools
          redis-server --version

      - name: Create private SQLite/local CI dotenv
        shell: bash
        run: |
          umask 077
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import os
          import secrets

          backend = Path.cwd()
          local_root = backend.parent / "var" / "ci-local-base"
          local_root.mkdir(parents=True, exist_ok=True)

          values = {
              "APP_NAME": "Project1 CI",
              "ENVIRONMENT": "test",
              "DATABASE_URL": "sqlite+aiosqlite:///" + str(local_root / "test.db"),
              "DATABASE_SCHEMA": "app",
              "DB_AUTO_CREATE": "false",
              "AUDIT_TRUSTED_PROXIES": "none",
              "STORAGE_LOCAL_ROOT": str(local_root / "storage"),
              "JWT_SECRET": secrets.token_urlsafe(48),
              "JWT_ALGORITHM": "HS256",
              "FILE_URL_SECRET": secrets.token_urlsafe(48),
              "SMTP_SECURITY": "ssl",
          }
          with open(".env.dev", "x", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}='{value}'\n")
          os.chmod(".env.dev", 0o600)
          PY

      - name: Run real acceptance suite
        env:
          APP_ENV_FILE: .env.dev
        run: .venv/bin/python -m tests.acceptance_real.runner --port 8101

  backend-unit:
    name: Backend unit and deployment scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Sync backend dependencies
        run: uv sync --locked --managed-python --python 3.13

      - name: Run isolated backend unit tests
        run: .venv/bin/python -m tests.run_unit

      - name: Install Nginx syntax validator
        run: sudo apt-get update && sudo apt-get install -y nginx

      - name: Deployment activation and preflight tests
        env:
          PROJECT1_REQUIRE_NGINX: "1"
        run: .venv/bin/python -m pytest -q ../scripts/deploy/tests ../scripts/tests

  frontend-mobile:
    name: Mobile build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: frontend/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run mobile tests
        run: node --test tests/*.test.js

      - name: Build mobile frontend
        env:
          PROJECT1_FRONTEND_CONFIG: public
        run: npm run build

      - name: Verify build output
        run: |
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/sw.js

  frontend-admin:
    name: Admin build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/admin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: frontend/admin/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run admin tests
        run: node --test tests/*.test.js

      - name: Build admin frontend
        env:
          PROJECT1_FRONTEND_CONFIG: public
        run: npm run build

      - name: Verify build output
        run: test -s dist/index.html

  realtime-integration:
    name: Realtime integration (real PostgreSQL + Redis)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Sync backend dependencies
        run: uv sync --locked --managed-python --python 3.13

      - name: Install dedicated Redis server for restart gate
        # Use the official repository: the distribution package may predate
        # Redis 8.2, which supplies the required XACKDEL ACKED primitive.
        run: |
          sudo apt-get update
          sudo apt-get install -y lsb-release curl gpg
          curl -fsSL https://packages.redis.io/gpg -o /tmp/project1-redis-signing-key
          sudo gpg --dearmor --batch --yes -o /usr/share/keyrings/redis-archive-keyring.gpg /tmp/project1-redis-signing-key
          sudo chmod 644 /usr/share/keyrings/redis-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/redis.list
          sudo apt-get update
          sudo apt-get install -y redis-server redis-tools
          redis-server --version

      - name: Run strict realtime integration gate
        env:
          CI_REALTIME_APPROVED: "1"
          CI_REALTIME_PG_ADMIN_URL: postgresql+asyncpg://postgres:ci-only-password@127.0.0.1:5432/postgres
          CI_REALTIME_REDIS_MANAGED: "1"
        run: .venv/bin/python -m tests.integration_real.runner


  loadtest-rust:
    name: Load driver tests and clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: loadtest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: loadtest

      - name: Run tests
        run: cargo test --locked

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings
