name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Maven
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: oracle-openjdk
          java-version: "27"
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend / Vue
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install npm and locked dependencies
        run: |
          npm install --global npm@12.2.1
          npm ci
      - name: Check generated API types
        run: |
          npm run generate:api
          git diff --exit-code -- shared/api-types.ts
      - name: Check lint and formatting
        run: |
          npm run lint
          npm run format:check
      - name: Type-check and build both apps
        run: npm run build
